<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>report-queue — фоновая генерация отчётов</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1f2933; --muted:#6b7280; --accent:#3b6fd6; --ok:#2e8b57; --err:#c0392b; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; font:15px/1.5 system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  button { padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .job { border-top: 1px solid var(--line); padding: 12px 0; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
  .job:first-child { border-top: 0; }
  .id { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .state { font-size: 13px; color: var(--muted); }
  .bar { grid-column: 1 / -1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .SUCCESS .bar > div { background: var(--ok); }
  .FAILURE .bar > div { background: var(--err); width: 100% !important; }
  .links a { margin-left: 10px; color: var(--accent); text-decoration: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: var(--accent); font-size: 12px; }
  .err { color: var(--err); font-size: 13px; grid-column: 1 / -1; }
</style>
</head>
<body>
<main>
  <h1>Фоновая генерация отчётов</h1>
  <div class="sub">Заказ принимается мгновенно (202), отчёт строит воркер. Бэкенд: <span class="badge" id="backend">…</span>
    брокер: <span class="badge" id="broker">…</span></div>

  <div class="card">
    <form id="form">
      <div><label>Строк данных</label><input name="rows" type="number" min="100" max="1000000" value="50000"></div>
      <div><label>Группировка</label>
        <select name="group_by"><option value="region">по регионам</option><option value="category">по категориям</option><option value="month">по месяцам</option></select></div>
      <div><label>Заголовок</label><input name="title" value="Отчёт по продажам"></div>
      <div><label>Сколько заказать</label><input name="count" type="number" min="1" max="50" value="1"></div>
      <div><button type="submit" id="submit">Заказать</button></div>
    </form>
  </div>

  <div class="card" id="jobs"><div class="state">Заказов пока нет.</div></div>
</main>

<script>
const jobs = new Map();          // id -> element
const $jobs = document.getElementById('jobs');

fetch('/health').then(r => r.json()).then(h => {
  document.getElementById('backend').textContent = h.backend;
  document.getElementById('broker').textContent = h.broker;
});

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const body = { rows: +f.get('rows'), group_by: f.get('group_by'), title: f.get('title'),
                 seed: Math.floor(Math.random() * 1e6) };
  const count = +f.get('count');
  if (jobs.size === 0) $jobs.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const r = await fetch('/reports', { method: 'POST', headers: {'content-type': 'application/json'},
                                        body: JSON.stringify({ ...body, seed: body.seed + i }) });
    const { id } = await r.json();
    addJob(id);
  }
});

// /?demo=5 — сразу заказать 5 отчётов (для демонстрации распределения по воркерам)
const demo = +new URLSearchParams(location.search).get('demo');
if (demo > 0) {
  document.querySelector('[name=count]').value = Math.min(demo, 50);
  document.getElementById('form').requestSubmit();
}

function addJob(id) {
  const el = document.createElement('div');
  el.className = 'job PENDING';
  el.innerHTML = `<span class="id">${id}</span><span class="state">PENDING</span>
                  <div class="bar"><div></div></div>`;
  $jobs.prepend(el);
  jobs.set(id, el);
  poll(id);
}

async function poll(id) {
  const el = jobs.get(id);
  const r = await fetch('/reports/' + id);
  if (r.status === 404) { render(el, { state: 'FAILURE', error: 'не найден', progress: 0 }); return; }
  const s = await r.json();
  render(el, s);
  if (s.state !== 'SUCCESS' && s.state !== 'FAILURE') setTimeout(() => poll(id), 400);
}

function render(el, s) {
  el.className = 'job ' + s.state;
  el.querySelector('.bar > div').style.width = (s.progress || 0) + '%';
  const step = s.step ? ` · ${s.step}` : '';
  let html = `${s.state} ${s.progress || 0}%${step}`;
  if (s.state === 'SUCCESS') {
    html = `<span class="links">SUCCESS` +
      Object.entries(s.links || {}).map(([k, v]) => `<a href="${v}">${k.toUpperCase()}</a>`).join('') + `</span>`;
  }
  el.querySelector('.state').innerHTML = html;
  el.querySelector('.err')?.remove();
  if (s.error) el.insertAdjacentHTML('beforeend', `<div class="err">${s.error}</div>`);
}
</script>
</body>
</html>
