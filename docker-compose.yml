# Инфраструктура и сервисы демо-проекта.
# `docker compose up --build` поднимает всё: брокеры, API, воркеры Celery и RQ, beat, Flower.
# Масштабирование воркеров: docker compose up -d --scale worker-celery=4
# Переключение бэкенда/брокера — TASK_BACKEND / BROKER_URL в .env (затем `up -d api`).

x-app: &app
  build: .
  image: report-queue:local   # один образ для всех сервисов приложения
  env_file: .env
  # Пустой блок обязателен: без него `docker compose run -e` падает (баг Compose 2.34, nil map)
  environment:
    PYTHONPATH: /app
    # Переменная хоста имеет приоритет над .env — так bench/run_matrix.py переключает брокер
    BROKER_URL: ${BROKER_URL:-redis://redis:6379/0}
    TASK_BACKEND: ${TASK_BACKEND:-celery}
    RQ_WORKER_CLASS: ${RQ_WORKER_CLASS:-fork}
    # Result backend и метрики бенчмарка — на отдельном Redis, чтобы брокер не делил сервер с хранилищем
    RESULT_BACKEND_URL: ${RESULT_BACKEND_URL:-redis://redis-backend:6379/0}
    CELERY_EVENTS: ${CELERY_EVENTS:-true}
    BROKER_CONFIRM_PUBLISH: ${BROKER_CONFIRM_PUBLISH:-false}
    # Вероятность сбоя уведомления: на демо поднимается, чтобы retry было видно наверняка
    NOTIFY_FAILURE_RATE: ${NOTIFY_FAILURE_RATE:-0.5}
  volumes:
    - artifacts:/data/artifacts
  depends_on:
    redis:
      condition: service_healthy
    redis-backend:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Result backend Celery и метрики бенчмарка. Отдельный сервер: у брокера и хранилища
  # результатов разный профиль нагрузки, а в эксперименте это условие честного сравнения брокеров.
  redis-backend:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Приложение ---
  api:
    <<: *app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Celery ---
  worker-celery:
    <<: *app
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info --concurrency=1 --queues=reports,notifications

  beat:
    <<: *app
    command: celery -A app.tasks.celery_app beat --loglevel=info

  flower:
    <<: *app
    command: celery -A app.tasks.celery_app flower --port=5555
    environment:
      PYTHONPATH: /app
      FLOWER_UNAUTHENTICATED_API: "true"  # REST API Flower без логина (демо/бенчмарк)
    ports:
      - "5555:5555"

  # --- RQ ---
  worker-rq:
    <<: *app
    command: python -m app.tasks.rq_app reports notifications

volumes:
  artifacts:
