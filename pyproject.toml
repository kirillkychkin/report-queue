[project]
name = "report-queue"
version = "0.1.0"
description = "Демо-проект: фоновая генерация отчётов через Celery/RQ поверх Redis/RabbitMQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "celery[redis]",
    "flower",
    "rq",
    "redis",
    "pika",
    "pandas",
    "matplotlib",
    "pydantic>=2",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "python-pptx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
